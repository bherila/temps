name: Self-hosted CI (tempsdev1)

# SAFETY: this workflow runs on the self-hosted EC2 runner, so it MUST NOT be
# reachable by untrusted code. It triggers ONLY on pushes to branches in this
# repo (strangers cannot push to your fork) and on manual dispatch. There is
# deliberately no `pull_request` trigger here — fork PR CI runs on isolated
# GitHub-hosted runners via rust-tests.yml instead. Never add `pull_request`
# or `pull_request_target` to a self-hosted job.
on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

# One run per branch; newer pushes cancel older queued runs so the single
# runner doesn't pile up.
concurrency:
  group: self-hosted-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, x64]
    steps:
      # Persistent local build cache. CARGO_TARGET_DIR is pinned OUTSIDE the
      # runner's _work dir so actions/checkout's `git clean -ffdx` never wipes
      # it. CARGO_HOME is left at its default (~/.cargo) so the runner reuses
      # the box's already-warm registry instead of re-downloading crates.
      # This is plain local disk, not subject to the 10 GB Actions cache limit.
      - name: Configure persistent cargo target dir
        run: echo "CARGO_TARGET_DIR=$HOME/.cache/temps-ci/target" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # No toolchain step: the box uses the system Rust (Amazon Linux package,
      # /usr/bin/cargo, currently 1.95.0 — already >= the 1.91 the AWS crates
      # need). There is no rustup on this host, so dtolnay/rust-toolchain would
      # not work here.
      - name: Toolchain info
        run: cargo --version && rustc --version

      # Several crates embed a built web UI via `include_dir!(".../dist")`
      # (temps-cli and the example plugins). Their build.rs writes that dir into
      # the (gitignored) source tree, but only when it actually runs — and with
      # a persistent CARGO_TARGET_DIR the build-script fingerprint is cached, so
      # after actions/checkout's `git clean -ffdx` wipes the dirs the scripts are
      # skipped and the macro panics on a missing dir. Recreate the same debug
      # placeholders up front so `cargo check --all-targets` is independent of
      # build-script cache state. Keep this list in sync with `include_dir!`
      # call sites: `git grep -n 'include_dir!' -- '*.rs'`.
      - name: Prepare embedded web assets
        run: |
          dist_dirs="crates/temps-cli/dist"
          for web in examples/*/web; do dist_dirs="$dist_dirs $web/dist"; done
          for d in $dist_dirs; do
            mkdir -p "$d"
            [ -f "$d/index.html" ] || \
              printf '<!doctype html><title>placeholder</title>\n' > "$d/index.html"
          done

      - name: cargo check
        run: cargo check --workspace --all-targets

      # Library unit tests for the same crate set rust-tests.yml runs in its
      # `unit-a`/`unit-b` jobs. The integration-heavy crates (temps-domains,
      # temps-deployments, temps-deployer, …) are deliberately excluded here —
      # hosted runs those in dedicated Docker+networking integration jobs, and
      # tests like the real-Pebble ACME HTTP-01 flow need a challenge-responder
      # network this box doesn't provide. Keep this list in sync with the
      # unit-a/unit-b matrix in rust-tests.yml. (temps-captcha-wasm is omitted:
      # it needs a wasm-pack build step we don't run here.)
      - name: cargo test (unit crates)
        run: |
          cargo test --no-fail-fast --lib \
            -p temps-providers -p temps-presets -p temps-auth -p temps-core \
            -p temps-monitoring -p temps-kv -p temps-analytics-funnels \
            -p temps-webhooks -p temps-infra -p temps-geo -p temps-environments \
            -p temps-audit -p temps-analytics-performance -p temps-proxy \
            -p temps-error-tracking -p temps-git -p temps-screenshots \
            -p temps-routes -p temps-entities -p temps-cli -p temps-status-page \
            -p temps-import -p temps-queue -p temps-query \
            -p temps-analytics-session-replay -p temps-dns -p temps-email \
            -p temps-analytics -p temps-analytics-events -p temps-otel
